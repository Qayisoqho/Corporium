try{const saved=localStorage.getItem('ordos-text-scale');if(['0.9','1','1.1','1.2','1.3','1.5'].includes(saved))scaleSelect.value=saved}catch{}
function applyTextScale(){document.documentElement.style.setProperty('--text-scale',scaleSelect.value)}
applyTextScale();
scaleSelect.onchange=()=>{applyTextScale();try{localStorage.setItem('ordos-text-scale',scaleSelect.value)}catch{}};
